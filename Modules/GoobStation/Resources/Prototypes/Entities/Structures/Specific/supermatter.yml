- type: entity
  parent: BaseStructure
  id: Supermatter
  name: supermatter crystal
  description: A strangely translucent and iridescent crystal.
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Sprite
    sprite: Structures/supermatter.rsi
    state: supermatter
    drawdepth: Mobs
    offset: "0.0,0.25"
  - type: AmbientSound
    range: 5
    volume: 0
    sound:
      path: /Audio/Supermatter/calm.ogg
      params:
        variation: 0.5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 60
        mask:
        - MachineMask
        layer:
        - MachineLayer
        - WallLayer
  - type: PointLight
    enabled: true
    radius: 10
    energy: 2.5
    color: "#ffe000"
  - type: WarpPoint
    follow: true
    location: supermatter
  - type: Speech
    speechSounds: Pai
  - type: GuideHelp
    guides: [ Power ]
  - type: Battery # Used to store SMs energy
  - type: GasMixtureHolder # Used to hold reaction-gases inside SM
    air:
      volume: -1 # Negative volume prevents pressure raising
  - type: AtmosDevice
  - type: AtmosExposed
  - type: GasDevourer
    transferRate: 10
  - type: Temperature
    atmosTemperatureTransferEfficiency: 0.25
  - type: DestroyInteractings
    destroyBlacklist: 
      tags:
      - SupermatterImmune
    respectContacts: true
    destructionSound: /Audio/Supermatter/ashing.ogg
    spawnOnDestruction: Ash
