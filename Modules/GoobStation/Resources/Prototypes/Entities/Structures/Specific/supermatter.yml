- type: entity
  parent: BaseStructure
  id: Supermatter
  name: supermatter crystal
  description: A strangely translucent and iridescent crystal.
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Sprite
    sprite: Structures/supermatter.rsi
    state: supermatter
    drawdepth: Mobs
    offset: "0.0,0.25"
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: PointLight
    enabled: true
    radius: 10
    energy: 2.5
    color: "#ffe000"
  - type: GasMixtureHolder
    volume: 100
  - type: WarpPoint
    follow: true
    location: supermatter
  - type: Speech
    speechSounds: Pai
  - type: GuideHelp
    guides: [ Power ]
